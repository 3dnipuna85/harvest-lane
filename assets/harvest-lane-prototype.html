<title>Harvest Lane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
/* Layout: an isometric 3D farm island (WebGL) on the left, the wooden barn ledger with tabs on the right; stacks on phones.
   Single daylight look by choice: every color is set explicitly so it reads the same on any host theme. */
:root{
  --field:#bfe0a0;
  --field-2:#acd48a;
  --soil:#8a5530;
  --board:#fffaf0;
  --board-edge:#e3cfa6;
  --ink:#2f2416;
  --muted:#7b6a52;
  --coin:#f0b21a;
  --barn:#c8422c;
  --barn-dark:#9c2f1e;
  --leaf:#3f8f2f;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,.55), transparent 40%),
    repeating-linear-gradient(135deg, var(--field) 0 22px, var(--field-2) 22px 44px);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  padding-inline:16px;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
.app{max-width:1240px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:clamp(26px,5vw,36px);color:var(--barn);letter-spacing:.5px;
  text-shadow:0 3px 0 var(--board),0 4px 0 rgba(0,0,0,.15);margin-right:auto;line-height:1}
.pill{background:var(--board);border:3px solid var(--board-edge);border-radius:999px;padding:6px 14px;
  display:flex;align-items:center;gap:8px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.coin-dot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,var(--coin) 60%,#c98a00);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none;display:inline-block}
.coins-val{font-size:18px;min-width:3ch}
.lvl{font-family:var(--display);font-size:16px;color:var(--leaf)}
.xpbar{width:90px;height:10px;border-radius:6px;background:#efe3c8;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .3s}
.pill.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.08)}}

.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

.board{background:var(--board);border:3px solid var(--board-edge);border-radius:18px;padding:14px;
  box-shadow:0 5px 0 rgba(60,40,10,.15);min-width:0}
.board h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--ink);letter-spacing:.3px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;font-weight:700;margin:2px 0 0}

.seeds{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:thin}
.seed{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:68px;padding:6px 8px;border-radius:12px;
  background:#fff;border:2px solid var(--board-edge);font-weight:800;font-size:12px;color:var(--muted);transition:transform .1s}
.seed .ic{font-size:26px;line-height:1.1}
.seed .c{color:var(--ink);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.seed .c .coin-dot{width:12px;height:12px}
.seed.sel{border-color:var(--leaf);background:#eef8e6;box-shadow:0 0 0 2px var(--leaf) inset;color:var(--leaf)}
.seed.locked{opacity:.5;filter:grayscale(1)}
.seed:not(:disabled):active{transform:scale(.95)}

/* 3D scene */
.scene-wrap{position:relative;border-radius:14px;overflow:hidden;border:3px solid #6f4a24;box-shadow:0 3px 0 rgba(0,0,0,.15);
  background:#74c043;min-height:240px}
.scene-wrap canvas{display:block;width:100%;cursor:pointer}
.scene-wrap.shake{animation:shake .3s}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:11px;line-height:1.15;color:var(--ink);background:rgba(255,250,240,.94);
  border-radius:10px;padding:2px 7px;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:4px;will-change:transform;font-variant-numeric:tabular-nums}
.lbl .coin-dot{width:11px;height:11px}
.lbl.timer{background:rgba(255,250,240,.95);color:var(--ink);font-size:10px;padding:2px 6px 3px;flex-direction:column;gap:2px;border:2px solid #4a2e1a;border-radius:10px}
.lbl.timer b{display:block;width:38px;height:5px;border-radius:3px;background:#e9dcc0;overflow:hidden}
.lbl.timer b i{display:block;height:100%;background:#6cc04a}
.lbl.barn{border:2px solid #4a2e1a;font-size:12px}
.lbl.buy{flex-direction:column;gap:1px;font-size:12px;background:rgba(255,255,255,.92);padding:4px 10px;border:2px solid #4a2e1a}
.lbl.buy .r{display:flex;align-items:center;gap:4px}
.lbl.sign{flex-direction:column;gap:1px;background:#f3dcae;border:2px solid #9a6b35;color:#5a3a17}
.lbl.sign .r{display:flex;align-items:center;gap:4px}
.lbl.lock{background:rgba(255,250,240,.7);color:var(--muted)}
.lbl.bar{padding:3px;width:58px;border:2px solid #4a2e1a}
.lbl.bar i{display:block;height:6px;border-radius:3px;background:var(--coin)}
.lbl.q{background:var(--board);color:var(--barn);font-size:12px;border:2px solid #4a2e1a;border-radius:50%;width:24px;height:24px;justify-content:center;padding:0}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:2px solid var(--board-edge);background:var(--board);font-family:var(--display);font-size:20px;line-height:1;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.scene-note{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-weight:800;color:var(--ink)}
.expand{margin-top:10px;width:100%;padding:10px;border-radius:12px;border:2px dashed var(--soil);background:transparent;font-weight:900;color:var(--soil);
  display:flex;align-items:center;justify-content:center;gap:6px}
.expand:disabled{opacity:.45}
.expand .coin-dot{width:14px;height:14px}

.tabs{display:flex;gap:6px;margin:-2px 0 12px;flex-wrap:wrap}
.tab{position:relative;padding:8px 14px;border-radius:10px;border:none;background:#f2e6cc;font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.3px}
.tab.on{background:var(--barn);color:#fff;box-shadow:0 3px 0 var(--barn-dark)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--leaf);color:#fff;
  font-family:var(--body);font-weight:900;font-size:11px;display:grid;place-items:center;border:2px solid var(--board)}
.list{display:flex;flex-direction:column;gap:9px}
.card{background:#fff;border:2px solid var(--board-edge);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .big{font-size:30px;line-height:1;flex:none;width:38px;text-align:center}
.card .ttl{font-weight:900;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;font-weight:700}
.grow{flex:1;min-width:0}
.btn{border:none;border-radius:10px;padding:7px 12px;font-weight:900;font-size:13px;background:var(--leaf);color:#fff;box-shadow:0 3px 0 #2c6820;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #2c6820}
.btn.alt{background:#f2e6cc;color:var(--ink);box-shadow:0 3px 0 var(--board-edge)}
.btn.gold{background:var(--coin);color:var(--ink);box-shadow:0 3px 0 #b98400}
.btn.red{background:var(--barn);box-shadow:0 3px 0 var(--barn-dark)}
.btn:disabled{opacity:.42;filter:grayscale(.6)}
.btn .coin-dot{width:13px;height:13px}
.needs{display:flex;gap:6px;flex-wrap:wrap}
.need{display:flex;align-items:center;gap:4px;background:#f7f0e0;border-radius:8px;padding:3px 8px;font-weight:900;font-variant-numeric:tabular-nums;font-size:13px}
.need span:first-child{font-size:18px}
.need.ok{background:#e1f3d6;color:var(--leaf)}
.reward{display:flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums}
.mbar{height:8px;border-radius:5px;background:#efe3c8;overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--coin)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--leaf)}
.count{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.empty-note{color:var(--muted);font-weight:700;padding:18px 6px;text-align:center}
.lockedcard{opacity:.6}
.small{font-size:12px;color:var(--muted);font-weight:700}

.fx{position:fixed;pointer-events:none;font-weight:900;font-size:16px;z-index:50;animation:rise .9s ease-out forwards;
  text-shadow:0 2px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;white-space:nowrap;transform:translate(-50%,-50%);color:var(--ink)}
.fx.gold{color:#b07800}
.fx.green{color:var(--leaf)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,360px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:tin .25s}
.toast.lv{background:var(--leaf);font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.3px}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.fx,.toast,.pill.bump,.scene-wrap.shake{animation:none!important}}
</style>

<div class="app">
  <header class="hud">
    <div class="brand">Harvest Lane</div>
    <div class="pill" id="coinPill"><span class="coin-dot"></span><span class="coins-val" id="coins">0</span></div>
    <div class="pill"><span class="lvl" id="lvl">Lv 1</span><span class="xpbar"><i id="xp"></i></span></div>
  </header>

  <main class="main">
    <section class="board" aria-label="Farm">
      <div class="row"><h2>The Farm</h2></div>
      <p class="hint" id="hint">Tap soil and your farmer walks over to plant. Tap ripe crops to harvest. Taps queue up, so tap several at once.</p>
      <div class="seeds" id="seeds"></div>
      <div class="scene-wrap" id="sceneWrap"><div class="overlay" id="overlay"></div><div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div></div>
      <button class="expand" id="expand" data-act="expand"></button>
    </section>

    <section class="board" aria-label="Barn">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </section>
  </main>
</div>
<div class="toasts" id="toasts"></div>

<script>
(() => {
if (!window.THREE){ document.getElementById('sceneWrap').insertAdjacentHTML('beforeend','<div class="scene-note">The 3D engine could not load. Check your connection and reload the page.</div>'); return; }
const CROPS = {
  wheat:     {name:'Wheat',      icon:'🌾', seed:2,  time:6,  sell:4,  lvl:1, xp:1},
  corn:      {name:'Corn',       icon:'🌽', seed:6,  time:12, sell:11, lvl:2, xp:2},
  carrot:    {name:'Carrot',     icon:'🥕', seed:10, time:18, sell:18, lvl:3, xp:3},
  tomato:    {name:'Tomato',     icon:'🍅', seed:16, time:28, sell:30, lvl:5, xp:5},
  strawberry:{name:'Strawberry', icon:'🍓', seed:26, time:40, sell:50, lvl:7, xp:7},
};
const GOODS = {
  bread:  {name:'Bread',          icon:'🍞', sell:22},
  popcorn:{name:'Popcorn',        icon:'🍿', sell:38},
  juice:  {name:'Carrot Juice',   icon:'🧃', sell:72},
  sauce:  {name:'Tomato Sauce',   icon:'🥫', sell:120},
  cake:   {name:'Strawberry Cake',icon:'🍰', sell:260},
};
const MACHINES = {
  bakery: {name:'Bakery',      in:{wheat:3},             out:'bread',   time:8,  cost:120,  lvl:2, wall:'#efc27d', roof:'#a8642c'},
  popper: {name:'Popcorn Pot', in:{corn:2},              out:'popcorn', time:10, cost:350,  lvl:3, wall:'#f6dc6a', roof:'#c2412f'},
  juicer: {name:'Juicer',      in:{carrot:3},            out:'juice',   time:14, cost:900,  lvl:4, wall:'#f3a24c', roof:'#5d7f34'},
  cannery:{name:'Cannery',     in:{tomato:3},            out:'sauce',   time:18, cost:2200, lvl:6, wall:'#e3ddcf', roof:'#9a3b2b'},
  oven:   {name:'Cake Oven',   in:{strawberry:2,bread:1},out:'cake',    time:24, cost:5000, lvl:8, wall:'#f2b3c4', roof:'#7a4a8c'},
};
const ITEMS = {...CROPS, ...GOODS};
const CUSTOMERS = ['Rosa’s Diner','Maple Street Market','The Corner Bakery','Uncle Teo','School Canteen','Harbor Café','Mrs. Pell','Night Market Stall','Hilltop Hotel','Sunday Picnic Club'];
const MAX_PLOTS = 20, MAX_FARMHANDS = 6, MAX_SELLERS = 5, MAX_MLVL = 5;
const SAVE_KEY = 'harvest-lane-3d-v1';

let S;
const $ = id => document.getElementById(id);
const now = () => Date.now();
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : n >= 1e4 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'k' : Math.floor(n).toLocaleString();
const coinHTML = '<span class="coin-dot"></span>';
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function fresh(){
  const t = now();
  const s = {
    coins:30, xp:0, level:1, sel:'wheat', tab:'orders',
    plots:Array.from({length:6},()=>({crop:null,at:0})),
    inv:{}, machines:{}, farmhands:0, sellers:0, sellCrops:false,
    orders:[], skipUntil:0, orderSeq:0, saved:t,
  };
  s.plots[0] = {crop:'wheat', at:t-4500};
  s.plots[1] = {crop:'wheat', at:t-6500};
  s.plots[2] = {crop:'wheat', at:t-2000};
  s.inv.wheat = 2;
  for (const k in MACHINES) s.machines[k] = {owned:false,lvl:1,job:null,on:true};
  return s;
}

/* ---------- economy ---------- */
const xpNeed = l => Math.round(14*Math.pow(l,1.55));
const plotCost = () => Math.round(40*Math.pow(1.5,S.plots.length-6));
const farmhandCost = () => Math.round(80*Math.pow(1.8,S.farmhands));
const sellerCost = () => Math.round(150*Math.pow(1.9,S.sellers));
const mTime = k => MACHINES[k].time * Math.pow(0.82, S.machines[k].lvl-1);
const mUpCost = k => Math.round(MACHINES[k].cost*0.6*S.machines[k].lvl);
const inv = k => S.inv[k]||0;
const add = (k,n) => { S.inv[k] = inv(k)+n; };
const ripe = p => !!p.crop && now() >= p.at + CROPS[p.crop].time*1000;
const unlockedCrops = () => Object.keys(CROPS).filter(k=>CROPS[k].lvl<=S.level);

function gainXP(n){
  S.xp += n;
  while (S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level); S.level++;
    const news = [];
    for (const k in CROPS) if (CROPS[k].lvl===S.level) news.push(CROPS[k].icon+' '+CROPS[k].name+' seeds');
    for (const k in MACHINES) if (MACHINES[k].lvl===S.level) news.push(MACHINES[k].name);
    if (S.level===2) news.push('Farmhands');
    if (S.level===3) news.push('Market sellers');
    toast('Level '+S.level+'!'+(news.length?' Unlocked: '+news.join(', '):''),'lv');
    structDirty = true;
  }
}
function earn(n){ S.coins += n; const p=$('coinPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }

function plant(i, verbose){
  const p = S.plots[i], c = CROPS[S.sel];
  if (S.coins < c.seed){ if (verbose){ toast('You need '+c.seed+' coins for '+c.name+' seeds'); shakeScene(); } return false; }
  S.coins -= c.seed; p.crop = S.sel; p.at = now();
  const q = plotPos(i); for (let k=0;k<7;k++) dust3(q.x+(Math.random()-.5)*1.6, q.z+(Math.random()-.5)*1.4);
  return true;
}
function harvest(i){
  const p = S.plots[i], c = CROPS[p.crop];
  const n = Math.random()<0.15 ? 2 : 1;
  add(p.crop, n); gainXP(c.xp*n);
  const q = plotPos(i);
  for (let k=0;k<n;k++) spawnFly(c.icon, new THREE.Vector3(q.x,.8,q.z), barnDoor(), k*0.12);
  const [sx,sy] = toScreen(new THREE.Vector3(q.x,1.4,q.z));
  fx(sx, sy, '+'+n+' '+c.icon+(n>1?' bonus!':''), 'green');
  p.crop = null; p.at = 0;
}
function sell(k, n, x, y){
  n = Math.min(n, inv(k)); if (n<=0) return;
  S.inv[k] -= n; const g = n*ITEMS[k].sell; earn(g);
  if (x!=null) fx(x,y,'+'+fmt(g),'gold');
}
function buyPlot(){
  const c=plotCost();
  if (S.plots.length>=MAX_PLOTS) return;
  if (S.coins<c){ toast('A new plot costs '+fmt(c)+' coins'); shakeScene(); return; }
  S.coins-=c; S.plots.push({crop:null,at:0}); toast('New plot ready to plant');
}

function orderPool(){
  const pool = unlockedCrops().map(k=>({k,crop:true}));
  for (const m in MACHINES) if (S.machines[m].owned) pool.push({k:MACHINES[m].out,crop:false});
  return pool;
}
function newOrder(){
  const pool = orderPool().sort(()=>Math.random()-.5);
  const kinds = Math.min(pool.length, 1 + (Math.random()< (S.level>=3?.6:.3) ? 1:0) + (S.level>=5 && Math.random()<.3 ? 1:0));
  const items = {}; let value = 0;
  for (let j=0;j<kinds;j++){
    const it = pool[j];
    const q = it.crop ? 3+Math.floor(Math.random()*(4+S.level)) : 1+Math.floor(Math.random()*3);
    items[it.k] = q; value += ITEMS[it.k].sell*q;
  }
  return {id:++S.orderSeq, who:CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)], items,
          coins:Math.round(value*1.6+5), xp:Math.max(2,Math.round(value/6))};
}
const canFill = o => Object.entries(o.items).every(([k,q])=>inv(k)>=q);
function fillOrders(){ while (S.orders.length<3) S.orders.push(newOrder()); }

let slAcc = 0, structDirty = true, saleTurn = 0;
function sim(dt){
  const t = now();
  for (const k in MACHINES){
    const m = S.machines[k], d = MACHINES[k];
    if (!m.owned) continue;
    if (m.job && t >= m.job.end){
      add(d.out,1); gainXP(Math.max(2,Math.round(GOODS[d.out].sell/10))); m.job=null;
      const bx = BX[Object.keys(MACHINES).indexOf(k)+1];
      spawnFly(GOODS[d.out].icon, new THREE.Vector3(bx,1.2,BZ+1.1), barnDoor(), 0);
    }
    if (!m.job && m.on && Object.entries(d.in).every(([i,q])=>inv(i)>=q)){
      for (const [i,q] of Object.entries(d.in)) S.inv[i]-=q;
      m.job = {start:t, end:t+mTime(k)*1000};
    }
  }
  slAcc += dt*S.sellers/2.5;
  while (slAcc >= 1){
    slAcc -= 1;
    const goods = Object.keys(GOODS).filter(k=>inv(k)>0).sort((a,b)=>GOODS[b].sell-GOODS[a].sell);
    let k = goods[0];
    if (!k && S.sellCrops) k = Object.keys(CROPS).filter(c=>inv(c)>10).sort((a,b)=>CROPS[b].sell-CROPS[a].sell)[0];
    if (k){
      const who = sellersC[saleTurn++ % Math.max(1,sellersC.length)]; if (who) who.wave = 0.8;
      const [sx,sy] = toScreen(new THREE.Vector3(CARTP.x,2.2,CARTP.z));
      sell(k,1,sx,sy);
    }
  }
}

/* =====================================================================
   3D FARM ISLAND (three.js, orthographic isometric camera)
   ===================================================================== */
const wrap = $('sceneWrap'), overlay = $('overlay');
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ---------- cartoon materials: cel shading + inked outlines ---------- */
const GC = {}, MC = {}, ETX = {}, OLM = {};
const geo = (k, make) => GC[k] || (GC[k] = make());
const toonGrad = (()=>{ const d = new Uint8Array([110,185,240,255]); const t = new THREE.DataTexture(d,4,1,THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
function T(color, extra){
  const k = color + (extra ? JSON.stringify(extra) : '');
  return MC[k] || (MC[k] = new THREE.MeshToonMaterial(Object.assign({color, gradientMap:toonGrad}, extra||{})));
}
const INK = '#4a2e1a';
function olMat(t){
  return OLM[t] || (OLM[t] = (()=>{
    const m = new THREE.MeshBasicMaterial({color:INK, side:THREE.BackSide});
    m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * '+t.toFixed(3)+';'); };
    m.customProgramCacheKey = () => 'ol'+t;
    return m;
  })());
}
function roundedBox(w,h,d,r){
  r = Math.min(r, w/2-.001, h/2-.001, d/2-.001);
  const n = 5, g = new THREE.BoxGeometry(w,h,d,n,n,n), p = g.attributes.position, nr = g.attributes.normal;
  const ix = w/2-r, iy = h/2-r, iz = d/2-r, v = new THREE.Vector3(), c = new THREE.Vector3(), dv = new THREE.Vector3();
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    c.set(clamp(v.x,-ix,ix), clamp(v.y,-iy,iy), clamp(v.z,-iz,iz));
    dv.copy(v).sub(c);
    if (dv.lengthSq()>1e-10){ dv.normalize(); nr.setXYZ(i,dv.x,dv.y,dv.z); v.copy(c).addScaledVector(dv,r); p.setXYZ(i,v.x,v.y,v.z); }
  }
  return g;
}
const RB  = (w,h,d,r=.1) => geo('rb'+[w,h,d,r], ()=>roundedBox(w,h,d,r));
const Cap = (r,l) => geo('cp'+r+'|'+l, ()=>new THREE.CapsuleGeometry(r,l,6,14));
const Sph = (r) => geo('sp'+r, ()=>new THREE.SphereGeometry(r,22,16));
const Cyl = (a,b,h,s=22) => geo('cy'+[a,b,h,s], ()=>new THREE.CylinderGeometry(a,b,h,s));
const Cone= (r,h,s=16) => geo('cn'+[r,h,s], ()=>new THREE.ConeGeometry(r,h,s));
const Tri = (w,h,d) => geo('tr'+[w,h,d], ()=>{ const s=new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.lineTo(-w/2,0); const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); g.translate(0,0,-d/2); return g; });

/* part(): a cel-shaded mesh with an ink outline child */
function part(g, color, parent, x=0, y=0, z=0, o={}){
  const m = new THREE.Mesh(g, typeof color==='string' ? T(color) : color);
  m.position.set(x,y,z); m.castShadow = o.shadow!==false; m.receiveShadow = true;
  if (o.ol!==false){ const ol = new THREE.Mesh(g, olMat(o.ol||.028)); ol.raycast = ()=>{}; m.add(ol); }
  if (o.s) Array.isArray(o.s) ? m.scale.set(...o.s) : m.scale.setScalar(o.s);
  if (o.r) m.rotation.set(...o.r);
  if (parent) parent.add(m);
  return m;
}
function emojiTex(ch){
  if (ETX[ch]) return ETX[ch];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); x.font = '96px '+EMOJI; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ch,64,70);
  return ETX[ch] = new THREE.CanvasTexture(c);
}
function emojiSprite(ch, s){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(ch), transparent:true, depthWrite:false}));
  sp.scale.set(s,s,1); return sp;
}

/* ---------- painted ground: grass, dirt paths, tilled field ---------- */
const GW = 48;
function groundTexture(){
  const N = 2048, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), k = N/GW, P = (wx,wz)=>[(wx+GW/2)*k, (wz+GW/2)*k];
  x.fillStyle = '#74c043'; x.fillRect(0,0,N,N);
  // soft grass blotches
  for (let i=0;i<260;i++){
    const r = (1+Math.random()*3)*k, [px,pz] = [Math.random()*N, Math.random()*N];
    const g = x.createRadialGradient(px,pz,0,px,pz,r);
    const col = Math.random()<.5 ? '140,208,80' : '98,174,52';
    g.addColorStop(0,`rgba(${col},.55)`); g.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle = g; x.beginPath(); x.arc(px,pz,r,0,7); x.fill();
  }
  // dirt paths (outline, fill, highlight)
  const path = (pts, w) => {
    for (const [col, ww] of [['#b9864a', w+.35], ['#e2b878', w], ['#ebc78e', w*.45]]){
      x.strokeStyle = col; x.lineWidth = ww*k; x.lineCap = 'round'; x.lineJoin = 'round';
      x.beginPath(); pts.forEach((p,i)=>{ const [a,b] = P(...p); i ? x.lineTo(a,b) : x.moveTo(a,b); }); x.stroke();
    }
  };
  // tilled field area
  const rr = (x0,z0,x1,z1,r,fill,stroke) => { const [a,b]=P(x0,z0), [c2,d]=P(x1,z1); x.beginPath(); x.roundRect ? x.roundRect(a,b,c2-a,d-b,r*k) : x.rect(a,b,c2-a,d-b); if (fill){ x.fillStyle=fill; x.fill(); } if (stroke){ x.strokeStyle=stroke; x.lineWidth=.25*k; x.stroke(); } };
  rr(-7.2,-2.1,7.2,8.9,1.1,'#b69466','#8f6e43');
  rr(-6.9,-1.8,6.9,8.6,.9,'#c3a273',null);
  path([[-14,ROADZ],[14,ROADZ]], 1.7);
  path([[BX[0],BZ+1],[BX[0],ROADZ]], 1.2);
  for (let j=1;j<6;j++) path([[BX[j],BZ+1],[BX[j],ROADZ]], .8);
  path([[0,ROADZ],[0,-2]], 1.2);
  path([[CARTP.x,ROADZ],[CARTP.x+3,ROADZ]], 1.7);
  // pen ground
  rr(PEN.x0,PEN.z0,PEN.x1,PEN.z1,.8,'#b9a55c','#957f40');
  // pebbles on paths
  for (let i=0;i<180;i++){
    const wx = -13+Math.random()*26, wz = ROADZ+(Math.random()-.5)*1.3, [a,b] = P(wx,wz);
    x.fillStyle = Math.random()<.5 ? '#d2ae75' : '#f6e4bd'; x.beginPath(); x.ellipse(a,b,(.06+Math.random()*.08)*k,(.04+Math.random()*.05)*k,0,0,7); x.fill();
  }
  // grass tufts and tiny flowers
  for (let i=0;i<2200;i++){
    const [px,pz] = [Math.random()*N, Math.random()*N];
    const wx = px/k-GW/2, wz = pz/k-GW/2;
    if (wx>-7.4 && wx<7.4 && wz>-2.3 && wz<9.1) continue;
    if (Math.abs(wz-ROADZ)<1.2) continue;
    x.strokeStyle = 'rgba(70,140,40,.55)'; x.lineWidth = 2.2;
    x.beginPath(); x.moveTo(px-4,pz); x.lineTo(px-1,pz-8); x.moveTo(px,pz); x.lineTo(px+2,pz-9); x.moveTo(px+4,pz); x.lineTo(px+6,pz-6); x.stroke();
  }
  const fc = ['#ffffff','#ffe066','#ff9fc4','#c8a6ff'];
  for (let i=0;i<260;i++){
    const [px,pz] = [Math.random()*N, Math.random()*N], wx = px/k-GW/2, wz = pz/k-GW/2;
    if ((wx>-7.6 && wx<7.6 && wz>-2.5 && wz<9.3) || Math.abs(wz-ROADZ)<1.3) continue;
    x.fillStyle = fc[i%4]; for (let a=0;a<5;a++){ x.beginPath(); x.arc(px+Math.cos(a*1.26)*4, pz+Math.sin(a*1.26)*4, 3.4, 0, 7); x.fill(); }
    x.fillStyle = '#f2b318'; x.beginPath(); x.arc(px,pz,2.6,0,7); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}

function bush(g, x, z, s){

function fenceLine(g, pts, step){
  const posts = [], rails = [];
  for (let s=0;s<pts.length-1;s++){
    const [x0,z0] = pts[s], [x1,z1] = pts[s+1], L = Math.hypot(x1-x0,z1-z0), n = Math.max(1,Math.round(L/step));
    for (let i=0;i<=n;i++) posts.push([x0+(x1-x0)*i/n, z0+(z1-z0)*i/n]);
    rails.push({x:(x0+x1)/2, z:(z0+z1)/2, L, a:Math.atan2(x1-x0, z1-z0)});
  }
  const postG = Cap(.09,.55), pm = new THREE.InstancedMesh(postG, T('#c98f55'), posts.length), po = new THREE.InstancedMesh(postG, olMat(.025), posts.length);
  const d = new THREE.Object3D();
  posts.forEach(([x,z],i)=>{ d.position.set(x,.38,z); d.rotation.set(0,0,0); d.updateMatrix(); pm.setMatrixAt(i,d.matrix); po.setMatrixAt(i,d.matrix); });
  pm.castShadow = true; g.add(pm, po);
  for (const r of rails) for (const y of [.5,.27]){
    const m = part(Cap(.05, r.L), '#dba56a', g, r.x,y,r.z, {ol:.02});
    m.rotation.set(Math.PI/2,0,0); m.rotation.y = r.a; m.rotation.order = 'YXZ';
  }
}

const CROP_SPOTS = [[-.52,-.5],[.52,-.5],[-.52,.5],[.52,.5]];
function cropModel(type, ripeNow, c){
  if (type==='wheat'){
    const st = ripeNow ? '#e3b94a' : '#86c54d', hd = ripeNow ? '#f6d363' : '#a9d867';
    for (const [dx,dz,h,r] of [[-.12,0,.55,.1],[.1,.08,.65,-.1],[.02,-.12,.5,0],[.16,-.08,.45,.18]]){
      const s = part(Cap(.03,h), st, c, dx,h/2+.03,dz, {ol:.015, shadow:false}); s.rotation.z = r;
      part(Cap(.075,.18), hd, s, 0,h/2+.08,0, {ol:.018, shadow:false});
    }
  } else if (type==='corn'){
    part(Cap(.07,.85), '#5fae3d', c, 0,.5,0, {ol:.02});
    for (const [y,s] of [[.35,1],[.62,-1]]) part(Sph(.14), '#6fc24a', c, s*.17,y,0, {s:[2.2,.35,1], r:[0,0,s*.4], ol:.015, shadow:false});
    part(Cap(.1,.22), ripeNow ? '#ffd83d' : '#bde07f', c, .13,.72,.08, {r:[0,0,-.35], ol:.02});
    if (ripeNow) part(Sph(.07), '#b7d45a', c, .17,.95,.08, {ol:.015});
  } else if (type==='carrot'){
    for (const [dx,dz,rz] of [[-.07,0,.35],[.07,.04,-.3],[0,-.07,.05]]) part(Sph(.11), '#5cb840', c, dx,.38,dz, {s:[.7,1.6,.7], r:[0,0,rz], ol:.015, shadow:false});
    part(Sph(ripeNow ? .17 : .12), ripeNow ? '#ff8a24' : '#f0ad62', c, 0,.12,0, {s:[1,.75,1], ol:.02});
  } else if (type==='tomato'){
    part(Sph(.28), '#4fae3d', c, 0,.36,0, {s:[1,1.1,1]});
    for (const [dx,dy,dz] of [[.2,.3,.16],[-.18,.45,.17],[.06,.2,-.22],[.0,.58,.12]]) part(Sph(.11), ripeNow?'#ff4b3a':'#9fd25a', c, dx,dy,dz, {ol:.018});
  } else {
    part(Sph(.27), '#4caa3b', c, 0,.17,0, {s:[1,.55,1]});

    }

function buildCrop(type, stage){

function updatePlots(t, dt){
  for (let i=0;i<P3.length;i++){
    const P = P3[i], p = S.plots[i], q = plotPos(i);
    let stage = 'none', pr = 0;
    if (p.crop){ pr = Math.min(1,(now()-p.at)/(CROPS[p.crop].time*1000)); stage = pr>=1?'ripe':pr<.3?'sprout':'grow'; }
    const key = (p.crop||'') + stage;
    if (P.key !== key){
      if (P.crops) P.g.remove(P.crops);
      P.crops = stage==='none' ? null : buildCrop(p.crop, stage);
      if (P.crops) P.g.add(P.crops);
      P.key = key;
      if (stage==='ripe') P.pop = .35;
    }
    if (P.crops){
      if (stage==='ripe'){
        P.pop = Math.max(0,(P.pop||0)-dt);
        const s = 1.25 + Math.sin(P.pop/.35*Math.PI)*.25;
        P.crops.scale.set(s, s*(1+Math.sin(t*5+i)*.04), s);
        P.spark -= dt; if (P.spark<=0){ sparkle(q.x+(Math.random()-.5)*1.6, q.z+(Math.random()-.5)*1.4); P.spark = .5+Math.random()*.6; }
      } else { const s = stage==='sprout' ? 1+pr*1.5 : (.5+.5*pr)*1.25; P.crops.scale.setScalar(s); }
    }
    const growing = stage==='sprout' || stage==='grow';
    P.ripeF.visible = stage==='ripe';
    P.queueF.visible = queue.includes(i) || !!(player.task && player.task.i===i && player.state==='walk');
    if (P.queueF.visible) P.queueF.position.y = Math.sin(t*6)*.04;
    if (growing) lbl('t'+i, `<span>${Math.ceil(CROPS[p.crop].time*(1-pr))}s</span><b><i style="width:${(pr*100).toFixed(0)}%"></i></b>`, new THREE.Vector3(q.x,.5,q.z+1.05), 'timer');
  }
}

function removeChar(c){ scene.remove(c.v.root); }
function poseChar(c,t){
  const v = c.v, walking = c.state==='walk', working = c.state==='work';
  const hop = walking ? Math.abs(Math.sin(c.phase)) : 0;
  v.root.position.set(c.x, hop*.09, c.z);
  let dr = c.face - v.root.rotation.y; dr = Math.atan2(Math.sin(dr),Math.cos(dr));
  v.root.rotation.y += dr*.25;
  const sw = walking ? Math.sin(c.phase)*.8 : 0;
  v.legs[0].rotation.x = sw; v.legs[1].rotation.x = -sw;
  v.arms[0].rotation.set(walking ? -sw*.9 : Math.sin(t*2+c.phase)*.05, 0, .12);
  v.arms[1].rotation.set(walking ?  sw*.9 : -Math.sin(t*2+c.phase)*.05, 0, -.12);
  v.upper.rotation.set(0,0,walking ? Math.sin(c.phase)*.06 : 0);
  const breathe = walking ? 0 : Math.sin(t*2.4+c.phase)*.02;
  v.upper.position.y = .3; v.upper.scale.set(1-breathe*.5, 1+breathe, 1-breathe*.5);
  v.head.rotation.set(0, walking ? 0 : Math.sin(t*.7+c.phase)*.25, 0);
  v.hoe.visible = false; v.basket.visible = false;
  if (working){
    const p = c.act/c.actDur;
    if (c.actType==='plant'){
      v.hoe.visible = true;
      const k = (p*2)%1;
      v.arms[0].rotation.x = k<.55 ? -.6 + (-2.2)*(k/.55) : -2.8 + 2.1*((k-.55)/.45);
      v.arms[1].rotation.x = v.arms[0].rotation.x*.7;
      v.upper.rotation.x = k>.55 ? .3*((k-.55)/.45) : -.05;
      if (k>.55) { const sq = Math.sin(((k-.55)/.45)*Math.PI)*.06; v.upper.scale.set(1+sq,1-sq,1+sq); }
    } else {
      const s = Math.sin(p*Math.PI);
      v.basket.visible = true;
      v.upper.rotation.x = .55*s; v.upper.position.y = .3 - .1*s;
      v.legs[0].rotation.x = v.legs[1].rotation.x = -.35*s;
      v.arms[0].rotation.x = -1.3*s - .2; v.arms[1].rotation.x = -.6*s;
    }
  }
  if (c.wave>0){ v.arms[0].rotation.set(-2.9, 0, .3+Math.sin(t*16)*.35); v.root.position.y = Math.abs(Math.sin(t*12))*.06; }
}

const isBusy = i => res.has(i) || queue.includes(i);
function pickJob(){
  let i = S.plots.findIndex((p,j)=>ripe(p) && !isBusy(j));
  if (i>=0) return i;
  if (S.coins >= CROPS[S.sel].seed){ i = S.plots.findIndex((p,j)=>!p.crop && !isBusy(j)); if (i>=0) return i; }
  return -1;
}
function goTo(c,i){ const q = plotPos(i); c.tx = q.x + (c.kind==='hand'?-.4:0); c.tz = q.z + .15; c.task = {i}; c.state = 'walk'; res.set(i,c.id); }
function startWork(c){
  const p = S.plots[c.task.i];
  const type = !p ? null : !p.crop ? 'plant' : ripe(p) ? 'harvest' : null;
  if (!type){ finish(c); return; }
  c.state='work'; c.act=0; c.done=false; c.actType=type; c.face = Math.PI/4;
  c.actDur = c.kind==='player' ? (type==='plant'?.55:.45) : (type==='plant'?.95:.8);
}
function finish(c){ if (c.task && res.get(c.task.i)===c.id) res.delete(c.task.i); c.task=null; c.state='idle'; c.idleT=.2+Math.random()*.3; if (c.kind!=='seller') c.face = Math.PI/4; }
function updateChar(c,dt){
  if (c.state==='idle'){
    if (c.kind==='player'){ const i = queue.shift(); if (i!=null && S.plots[i]) goTo(c,i); }
    else if (c.kind==='hand'){ c.idleT -= dt; if (c.idleT<=0){ const i = pickJob(); if (i>=0) goTo(c,i); else c.idleT = .6; } }
  }
  if (c.state==='walk'){
    const dx = c.tx-c.x, dz = c.tz-c.z, d = Math.hypot(dx,dz), step = c.speed*dt;
    if (d>.01) c.face = Math.atan2(dx,dz);
    if (d<=step){ c.x=c.tx; c.z=c.tz; startWork(c); }
    else { c.x += dx/d*step; c.z += dz/d*step; c.phase += dt*(c.kind==='player'?15:11); }
  } else if (c.state==='work'){
    c.act += dt;
    if (!c.done && c.act >= c.actDur*.6){
      c.done = true;
      const i = c.task.i, p = S.plots[i];
      if (c.actType==='plant' && p && !p.crop) plant(i, c.kind==='player');
      else if (c.actType==='harvest' && p && ripe(p)) harvest(i);
    }
    if (c.act >= c.actDur) finish(c);
  }
  if (c.wave>0) c.wave -= dt;
}
function syncCrew(){
  while (hands.length < S.farmhands) hands.push(mkChar('hand',hands.length));
  while (hands.length > S.farmhands){ const h = hands.pop(); if (h.task && res.get(h.task.i)===h.id) res.delete(h.task.i); removeChar(h); }
  while (sellersC.length < S.sellers) sellersC.push(mkChar('seller',sellersC.length));
  while (sellersC.length > S.sellers) removeChar(sellersC.pop());
  sellersC.forEach((s,j)=>{ s.x = CARTP.x-1.35-j*.6; s.z = CARTP.z+.5+(j%2)*.3; s.face = Math.PI/4; });
}

  const sw = d>.05 ? Math.sin(c.phase)*.45 : 0;
  c.v.legs.forEach((l,k)=> l.rotation.x = (k===0||k===3) ? sw : -sw);
  c.v.head.rotation.x = d>.05 ? 0 : .35+Math.sin(t*1.3)*.15;
  c.v.tail.rotation.z = Math.sin(t*3)*.4;
}

function updatePuffs(dt){

function updateFlies(dt){
  for (const f of flies){
    f.t += dt/.85; if (f.t<0) continue;
    const k = Math.min(1,f.t), e = k*k*(3-2*k);
    f.sp.visible = true;
    f.sp.position.lerpVectors(f.from, f.to, e); f.sp.position.y += Math.sin(k*Math.PI)*2.6;
    const s = .95-.4*k; f.sp.scale.set(s,s,1);

}

/* camera: orthographic isometric, fitted to the island; zoomed in with drag-to-pan on phones */
let full = null, view = {hw:10, hh:10}, pan = {x:0,y:0}, CW = 600, CH = 400, zoomed = false, panInit = false;
function computeFull(){
  camera.position.set(24,21,24); camera.lookAt(0,0,0); camera.updateMatrixWorld(true);
  const inv = camera.matrixWorldInverse, a = [1e9,-1e9,1e9,-1e9];
  const pts = [];
  for (const x of [-13.5,13.5]) for (const z of [-9.8,11]){ pts.push([x,0,z]); }
  for (const x of [-13,13]) pts.push([x,3.6,-9.6]);
  for (const p of pts){ const v = new THREE.Vector3(...p).applyMatrix4(inv); a[0]=Math.min(a[0],v.x); a[1]=Math.max(a[1],v.x); a[2]=Math.min(a[2],v.y); a[3]=Math.max(a[3],v.y); }
  full = {cx:(a[0]+a[1])/2, cy:(a[2]+a[3])/2, sx:a[1]-a[0], sy:a[3]-a[2]};
}
let Z = 0;
function resize(){
  if (!ok3d) return;
  CW = Math.max(240, wrap.clientWidth);
  zoomed = CW < 560;
  let h = zoomed ? CW*1.1 : CW*.72;
  h = Math.min(h, Math.max(340, innerHeight*.8));
  CH = Math.round(h);
  renderer.setSize(CW, CH);
  if (!Z) Z = zoomed ? 2.3 : 1.75;
  if (!panInit){ const v = new THREE.Vector3(-2.6,0,-2.4).applyMatrix4(camera.matrixWorldInverse); pan = {x:v.x-full.cx, y:v.y-full.cy}; panInit = true; }
  applyCam();
  cvs.style.touchAction = 'none';
  $('hint').textContent = 'Tap soil to plant and ripe crops to harvest; taps queue up. Drag to move around, and use + and − to zoom.';
}
function setZoom(z){ Z = clamp(z, 1, 2.8); applyCam(); }
function applyCam(){
  const asp = CW/CH;
  let hw = full.sx/2*1.02/Z, hh = full.sy/2*1.02/Z;
  if (hw/hh < asp) hw = hh*asp; else hh = hw/asp;
  view = {hw, hh};
  const mx = Math.max(0, full.sx/2 - view.hw), my = Math.max(0, full.sy/2 - view.hh);
  pan.x = clamp(pan.x,-mx,mx); pan.y = clamp(pan.y,-my,my);
  const cx = full.cx+pan.x, cy = full.cy+pan.y;
  camera.left = cx-view.hw; camera.right = cx+view.hw; camera.top = cy+view.hh; camera.bottom = cy-view.hh;
  camera.updateProjectionMatrix();
}

/* input on the 3D scene */
const ray = new THREE.Raycaster ? new THREE.Raycaster() : null, ndc = new THREE.Vector2();
function tapPlot(i){
  const p = S.plots[i];
  if (p.crop && !ripe(p)){
    const q = plotPos(i), [sx,sy] = toScreen(new THREE.Vector3(q.x,1,q.z));
    fx(sx,sy, Math.ceil(CROPS[p.crop].time-(now()-p.at)/1000)+'s left',''); return;
  }
  if (queue.includes(i) || (player.task && player.task.i===i)) return;
  if (!p.crop && S.coins < CROPS[S.sel].seed){ toast('You need '+CROPS[S.sel].seed+' coins for '+CROPS[S.sel].name+' seeds'); shakeScene(); return; }
  if (queue.length>=12) return;
  queue.push(i);
}
function pick(cx,cy){
  const r = cvs.getBoundingClientRect();
  ndc.set((cx-r.left)/r.width*2-1, -((cy-r.top)/r.height*2-1));
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits){
    let o = h.object; while (o && !o.userData.type) o = o.parent;
    if (!o) continue;
    const u = o.userData;
    if (u.type==='plot'){ tapPlot(u.i); save(); return; }
    if (u.type==='buy'){ if (o.visible){ buyPlot(); save(); } return; }
    if (u.type==='bld'){ S.tab = u.id==='barn' ? 'barn' : 'machines'; structDirty = true; return; }
    if (u.type==='cart'){ S.tab = 'helpers'; structDirty = true; return; }
  }
}
let pd = null;
function bindInput(){
  const touches = new Map(); let pinch = null;
  cvs.addEventListener('pointerdown', e=>{
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (touches.size===2){ const [a,b] = [...touches.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), z:Z}; pd = null; return; }
    pd = {x:e.clientX, y:e.clientY, px:pan.x, py:pan.y, drag:false};
  });
  cvs.addEventListener('wheel', e=>{ e.preventDefault(); setZoom(Z * (e.deltaY<0 ? 1.1 : 1/1.1)); }, {passive:false});
  addEventListener('pointermove', e=>{
    if (touches.has(e.pointerId)) touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (pinch && touches.size===2){ const [a,b] = [...touches.values()]; setZoom(pinch.z * Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.d)); return; }
    if (!pd) return;
    const dx = e.clientX-pd.x, dy = e.clientY-pd.y;
    if (!pd.drag && Math.hypot(dx,dy)>8) pd.drag = true;
    if (pd.drag){ pan.x = pd.px - dx*(2*view.hw/CW); pan.y = pd.py + dy*(2*view.hh/CH); applyCam(); }
  });
  addEventListener('pointerup', e=>{ touches.delete(e.pointerId); if (touches.size<2) pinch = null; if (!pd) return; const was = pd; pd = null; if (!was.drag && Math.hypot(e.clientX-was.x,e.clientY-was.y)<10) pick(e.clientX, e.clientY); });
  addEventListener('pointercancel', e=>{ pd = null; touches.delete(e.pointerId); pinch = null; });
  $('zin').addEventListener('click', ()=>setZoom(Z*1.2));
  $('zout').addEventListener('click', ()=>setZoom(Z/1.2));
}

let seedSig='', lastT=0;
function frame(ts){
  const dt = Math.min(0.05, Math.max(0,(ts-lastT)/1000)); lastT = ts;
  const t = ts/1000;

    if (P3.length !== S.plots.length) syncPlots();
    syncBuildings(); syncCrew();
  }
  sim(dt);
  if (ok3d){
    updateChar(player,dt); hands.forEach(h=>updateChar(h,dt)); sellersC.forEach(s=>updateChar(s,dt));
    [player,...hands,...sellersC].forEach(c=>poseChar(c,t));
    chickens.forEach(h=>updateChicken(h,dt,t));
    cows.forEach(c=>updateCow(c,dt,t));
    updatePlots(t,dt); updateBuildings(dt); updatePuffs(dt); updateFlies(dt);
    const qn = queue.length + (player.task ? 1 : 0);
    if (queue.length) lbl('q', String(qn), new THREE.Vector3(player.x,2.5,player.z), 'q');
    for (const e of LBL.values()) if (!e._used) e.hidden = true;
    renderer.render(scene, camera);
  }
  const ss = S.sel+S.level+S.tab; if (ss!==seedSig || structDirty){ renderSeeds(); renderTabs(); seedSig=ss; }
  const ps = panelSignature(); if (ps!==panelSig || structDirty){ renderPanel(); panelSig=ps; }
  structDirty = false;
  updateDynamic();
  requestAnimationFrame(frame);
}

/* ---------- effects ---------- */
function fx(x,y,text,cls){
  const e=document.createElement('div'); e.className='fx '+(cls||''); e.textContent=text;
  e.style.left=x+'px'; e.style.top=y+'px'; document.body.appendChild(e); setTimeout(()=>e.remove(),950);
}
function toast(msg,cls){
  const box=$('toasts'); const e=document.createElement('div'); e.className='toast '+(cls||''); e.textContent=msg;
  box.appendChild(e); while(box.children.length>3) box.firstChild.remove(); setTimeout(()=>e.remove(), cls==='lv'?3800:2200);
}

/* ---------- panel input ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, i = +b.dataset.i;
  const r = b.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top;
  if (act==='seed'){ S.sel=k; }
  else if (act==='expand'){ buyPlot(); }
  else if (act==='tab'){ S.tab=b.dataset.t; }
  else if (act==='sell'){ sell(k, b.dataset.n==='all'?inv(k):1, cx, cy); }
  else if (act==='deliver'){
    const o = S.orders[i]; if (!o || !canFill(o)) return;
    for (const [kk,q] of Object.entries(o.items)) S.inv[kk]-=q;
    earn(o.coins); gainXP(o.xp); fx(cx,cy,'+'+fmt(o.coins)+' coins','gold');
    toast(o.who+' paid '+fmt(o.coins)+' coins');
    S.orders.splice(i,1); fillOrders();
  }
  else if (act==='skip'){ if (now()<S.skipUntil) return; S.orders.splice(i,1,newOrder()); S.skipUntil = now()+15000; }
  else if (act==='buyM'){ const d=MACHINES[k]; if (S.coins>=d.cost){ S.coins-=d.cost; S.machines[k].owned=true; toast(d.name+' built. It runs on its own when ingredients are in the barn.'); } }
  else if (act==='upM'){ const c=mUpCost(k); if (S.coins>=c && S.machines[k].lvl<MAX_MLVL){ S.coins-=c; S.machines[k].lvl++; fx(cx,cy,'Faster!','green'); } }
  else if (act==='toggleM'){ S.machines[k].on = b.checked; save(); return; }
  else if (act==='sellCrops'){ S.sellCrops = b.checked; save(); return; }
  else if (act==='hire'){
    if (k==='fh'){ const c=farmhandCost(); if (S.coins>=c && S.farmhands<MAX_FARMHANDS){ S.coins-=c; S.farmhands++; toast('Farmhand hired. Watch them head out to the field.'); } }
    else { const c=sellerCost(); if (S.coins>=c && S.sellers<MAX_SELLERS){ S.coins-=c; S.sellers++; toast('Seller hired. They are at the cart by the road.'); } }
  }
  else if (act==='reset'){
    if (!resetArmed){ resetArmed=true; clearTimeout(resetTimer); resetTimer=setTimeout(()=>{resetArmed=false;},4000); }
    else { resetArmed=false; S=fresh(); fillOrders(); initScene(); structDirty=true; toast('Fresh farm. Good luck!'); }
  }
  save();
});

/* ---------- persistence ---------- */
function save(){ if (!S) return; S.saved = now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function normalize(s){
  const base = fresh();
  if (!s || !Array.isArray(s.plots)) return base;
  const out = {...base, ...s, inv:{...(s.inv||{})}, machines:{...base.machines}};
  for (const k in MACHINES) if (s.machines && s.machines[k]) out.machines[k] = {...base.machines[k], ...s.machines[k]};
  if (!Array.isArray(out.orders)) out.orders = [];
  return out;
}
function start(data){
  S = normalize((data && data.state) || load());
  fillOrders();
  setup3D();
  initScene();
  resize();
  const away = (now() - (S.saved||now()))/1000;
  if (away > 60 && S.plots.some(p=>p.crop)) toast('Welcome back. Your crops kept growing while you were away.');
  window.claude?.hot?.snapshot?.(()=>({state:S}));
  setInterval(save, 5000);
  addEventListener('visibilitychange', ()=>{ if (document.hidden) save(); });
  requestAnimationFrame(ts=>{ lastT=ts; frame(ts); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
