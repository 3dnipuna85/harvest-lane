<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#74c043">
  <meta name="description" content="Harvest Lane: plant, harvest, bake and sell on your own cartoon farm.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Harvest Lane">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Harvest Lane</title>
</head>
<body>
  <div class="game" id="sceneWrap">
    <div class="overlay" id="overlay"></div>
  </div>

  <header class="hud">
    <div class="pill lvlpill" data-act="tab" data-t="farm"><img class="avatar" src="/ui/avatar.webp" alt=""><span class="lvlstar" aria-label="Level"><img src="/ui/star.webp" alt=""><b id="lvl">1</b></span><span class="xpbar"><i id="xp"></i></span></div>
    <div class="brand">Harvest Lane</div>
    <button class="pill truckpill" id="truckPill" data-act="tab" data-t="orders" hidden></button>
    <div class="pill" id="coinPill"><img class="coin-dot" src="/ui/coin.webp" alt="Coins"><span class="coins-val" id="coins">0</span></div>
    <button class="pill" id="gemPill" data-act="tab" data-t="shop" aria-label="Diamond shop"><img class="coin-dot" src="/ui/gem.webp" alt="Diamonds"><span class="coins-val" id="gems">0</span></button>
  </header>

  <div class="trouble" id="trouble" role="status" hidden></div>
  <section class="goals" id="goals" aria-label="Level targets" hidden></section>

  <div class="soundbox board" id="soundBox" hidden><b>Sound</b>
    <label class="toggle"><input type="checkbox" id="musicOn">Music</label>
    <label class="toggle"><input type="checkbox" id="sfxOn">Sound effects</label></div>
  <p class="hint" id="hint">Tap soil to plant and ripe crops to harvest. Drag to look around.</p>
  <div class="zoom"><button id="help" class="help" aria-label="How to play">?</button><button id="soundBtn" class="soundbtn" aria-label="Sound settings">🔊</button><button id="fishBtn" class="fishbtn" aria-label="Go fishing">🎣</button><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>

  <nav class="dock" aria-label="Farm tools">
    <div class="seeds" id="seeds"></div>
    <button class="expand" id="expand" data-act="expand"></button>
    <div class="tabs" id="tabs"></div>
  </nav>

  <nav class="dock towndock" id="townDock" aria-label="Market Town"></nav>
  <div class="travel" id="travel" hidden></div>

  <section class="board office" id="office" aria-label="Farm office" hidden>
    <h2 class="plank-title" id="officeTitle">Orders</h2>
    <button class="close" data-act="close" aria-label="Close">×</button>
    <div class="office-body" id="panel"></div>
  </section>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
